name: QualityHub SQA — Integración y Despliegue Continuo (CI/CD)

on:
  push:
    branches: [ "main", "master", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sqa-quality-gate:
    name: 1. Pruebas Unitarias y Verificación de Documentos SQA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar existencia de los 11 documentos de ingeniería y SQA
        run: |
          test -f docs/01-Vision-y-Alcance.md
          test -f docs/02-SRS.md
          test -f docs/03-SDS.md
          test -f docs/04-Wireframes.md
          test -f docs/05-Estrategia-de-Calidad-SQAP.md
          test -f docs/06-Reporte-de-Estado-Salud.md
          test -f docs/07-Checklist-de-Revision.md
          test -f docs/08-Revisiones-Personales.md
          test -f docs/09-Caminata.md
          test -f docs/10-Bitacora.md
          test -f docs/11-Retrospectiva.md
          test -f src/index.html
          test -f src/app.js
          echo "Los 11 documentos de SQA y archivos del sistema fueron verificados correctamente."

      - name: Ejecutar Suite de Pruebas Unitarias (Quality Gate)
        run: |
          python -m unittest discover -s tests -v

  deploy-pages:
    name: 2. Despliegue Automático del Dashboard (GitHub Pages)
    needs: sqa-quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar artefacto web desde src/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
